<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Fournisseurs</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800 p-8">

    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-900 mb-6">Gestion des Fournisseurs</h1>

        <div class="flex space-x-2 border-b border-gray-200 mb-6 pb-2">
            <a th:href="@{/fournisseurs}" 
               th:class="${selectedTypeId == null} ? 'px-4 py-2 bg-indigo-600 text-white rounded-md font-medium' : 'px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-md font-medium'">
               Tous les fournisseurs
            </a>
            
            <a th:each="type : ${types}" 
               th:href="@{/fournisseurs(typeId=${type.id})}"
               th:text="${type.libelle}"
               th:class="${selectedTypeId == type.id} ? 'px-4 py-2 bg-indigo-600 text-white rounded-md font-medium' : 'px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-md font-medium'">
               Type
            </a>
        </div>

        <div class="bg-white shadow-md rounded-lg overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Nom / Raison Sociale</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Type</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Interlocuteur</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Téléphone</th>
                        <th class="px-6 py-3 text-center text-xs font-semibold text-gray-600 uppercase">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <tr th:if="${#lists.isEmpty(fournisseurs)}">
                        <td colspan="5" class="px-6 py-10 text-center text-gray-500">
                            Aucun fournisseur trouvé pour cette catégorie.
                        </td>
                    </tr>
                    
                    <tr th:each="f : ${fournisseurs}" class="hover:bg-gray-50">
                        <td class="px-6 py-4 font-medium text-gray-900" th:text="${f.nom}">Nom</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 text-xs font-semibold rounded-full bg-blue-100 text-blue-800" 
                                  th:text="${f.typeFournisseur.libelle}">Type</span>
                        </td>
                        <td class="px-6 py-4 text-gray-600" th:text="${f.nomInterlocuteur}">Interlocuteur</td>
                        <td class="px-6 py-4 text-gray-600" th:text="${f.telephone}">Téléphone</td>
                        <td class="px-6 py-4 text-center">
                            <a th:href="@{/fournisseurs/details/{id}(id=${f.id})}" 
                               class="text-indigo-600 hover:text-indigo-900 font-medium">
                                Voir la fiche
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
