<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des bovins</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e9edf2 100%);
            min-height: 100vh;
        }
        .card-custom {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .card-custom:hover {
            transform: translateY(-5px);
        }
        .table-custom {
            border-radius: 15px;
            overflow: hidden;
        }
        .table-custom th {
            background-color: #2c3e50;
            color: white;
            font-weight: 600;
            border: none;
        }
        .btn-icon {
            margin: 0 5px;
            transition: all 0.2s;
        }
        .btn-icon:hover {
            transform: scale(1.05);
        }
        .badge-race {
            background-color: #3498db;
            color: white;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 0.85rem;
        }
        .action-icons i {
            font-size: 1.2rem;
        }
        .header-title {
            border-left: 5px solid #3498db;
            padding-left: 15px;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="card card-custom">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">
                <div>
                    <h1 class="header-title"><i class="bi bi-list-ul me-2 text-primary"></i>Gestion des bovins</h1>
                    <p class="text-muted mt-2">Liste complète des bovins enregistrés</p>
                </div>
                <a th:href="@{/bovin/creer}" class="btn btn-primary rounded-pill shadow-sm">
                    <i class="bi bi-plus-circle me-1"></i> Ajouter un bovin
                </a>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle table-custom">
                    <thead>
                    <tr>
                        <th width="80">ID</th>
                        <th width="80">Poids init</th>
                        <th width="80">Poids actuel</th>
                        <th width="80">Lot</th>
                        <th width="80">Mois init</th>
                        <th width="80">Mois actuel</th>
                        <th width="150" class="text-center">Date d'arrivée</th>
                        <th width="150" class="text-center">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="bovin : ${bovins}">
                        <td><span class="badge bg-secondary rounded-pill" th:text="${bovin.id}">1</span></td>
                        <td class="text-center" th:text="${bovin.poidsInit}">0</td>
                        <td class="text-center" th:text="${bovin.poidsActuel}">0</td>
                       <td class="text-center">
                            <th:block th:if="${bovin.lot != null}">
                                <span th:text="|#${bovin.lot.id}|">#1</span>
                                <span class="badge bg-primary ms-1" th:text="${bovin.lot.race.libelle}">Race</span>
                            </th:block>
                            
                            <th:block th:if="${bovin.lot == null}">
                                <span class="badge bg-danger">Aucun lot</span>
                            </th:block>
                        </td>
                        <td class="text-center" th:text="${bovin.moisInit}">0</td>
                        <td class="text-center" th:text="${bovin.moisActuel}">0</td>
                        <td class="text-center" th:text="${bovin.dateArrive}">0</td>
                        <td class="text-center action-icons">
                            <a th:href="@{/bovin/modif/{id}(id=${bovin.id})}" class="btn btn-sm btn-outline-warning btn-icon" title="Modifier">
                                <i class="bi bi-pencil-square"></i>
                            </a>
                            <a th:href="@{/bovin/delete/{id}(id=${bovin.id})}" class="btn btn-sm btn-outline-danger btn-icon" title="Supprimer"
                               onclick="return confirm('Supprimer définitivement ce bovin ?')">
                                <i class="bi bi-trash3"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(bovins)}">
                        <td colspan="8" class="text-center py-4">
                            <i class="bi bi-inbox display-4 text-muted"></i>
                            <p class="mt-2 mb-0">Aucun bovin enregistré pour le moment.</p>
                            <a th:href="@{/bovin/creer}" class="btn btn-sm btn-primary mt-2">Créer le premier bovin</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
