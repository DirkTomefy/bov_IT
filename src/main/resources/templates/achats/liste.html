<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Historique des Achats</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800 p-8">

    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-900 mb-6">Historique des Achats</h1>

        <div class="bg-white p-4 shadow-sm rounded-lg mb-6 border border-gray-100">
            <form th:action="@{/achats}" method="get" class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                
                <div>
                    <label for="typeFournisseurId" class="block text-sm font-medium text-gray-700 mb-1">Filtrer par Catégorie :</label>
                    <select name="typeFournisseurId" id="typeFournisseurId" class="w-full bg-gray-50 border border-gray-300 rounded-md p-2 text-sm focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="">-- Toutes les catégories --</option>
                        <option th:each="t : ${typesFournisseur}" 
                                th:value="${t.id}" 
                                th:text="${t.libelle}"
                                th:selected="${t.id == selectedTypeId}"></option>
                    </select>
                </div>

                <div>
                    <label for="fournisseurId" class="block text-sm font-medium text-gray-700 mb-1">Filtrer par Fournisseur :</label>
                    <select name="fournisseurId" id="fournisseurId" class="w-full bg-gray-50 border border-gray-300 rounded-md p-2 text-sm focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="">-- Tous les fournisseurs --</option>
                        <option th:each="f : ${fournisseurs}" 
                                th:value="${f.id}" 
                                th:text="${f.nom} + ' (' + ${f.typeFournisseur.libelle} + ')'"
                                th:selected="${f.id == selectedFournisseurId}"></option>
                    </select>
                </div>

                <div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-md text-sm transition shadow-sm">
                        Filtrer les résultats
                    </button>
                </div>
            </form>
        </div>

        <div class="bg-white shadow-md rounded-lg overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Code Achat / Facture</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Date</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Fournisseur</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Mode de Paiement</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Statut</th>
                        <th class="px-6 py-3 text-right text-xs font-semibold text-gray-600 uppercase">Montant Total</th>
                        <th class="px-6 py-3 text-center text-xs font-semibold text-gray-600 uppercase">Action</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <tr th:if="${#lists.isEmpty(achats)}">
                        <td colspan="7" class="px-6 py-10 text-center text-gray-500">
                            Aucun enregistrement d'achat trouvé pour ces critères de recherche.
                        </td>
                    </tr>
                    
                    <tr th:each="a : ${achats}" class="hover:bg-gray-50">
                        <td class="px-6 py-4 font-mono text-sm text-gray-900" th:text="'FAC-' + ${a.id}">FAC-001</td>
                        <td class="px-6 py-4 text-gray-600 text-sm" th:text="${#temporals.format(a.dateAchat, 'dd/MM/yyyy HH:mm')}">Date</td>
                        <td class="px-6 py-4">
                            <div class="text-sm font-medium text-gray-900" th:text="${a.fournisseur.nom}">Fournisseur</div>
                            <div class="text-xs text-gray-400" th:text="${a.fournisseur.typeFournisseur.libelle}">Type</div>
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-600" th:text="${a.typePayement.libelle}">Chèque</td>
                        <td class="px-6 py-4">
                            <span th:text="${a.etatPayement.libelle}"
                                  th:class="${a.etatPayement.libelle == 'Payé'} ? 'px-2 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-800' : (${a.etatPayement.libelle == 'En Dette'} ? 'px-2 py-1 text-xs font-semibold rounded-full bg-red-100 text-red-800' : 'px-2 py-1 text-xs font-semibold rounded-full bg-yellow-100 text-yellow-800')">
                                Statut
                            </span>
                        </td>
                        <td class="px-6 py-4 text-right font-bold text-gray-900" 
                            th:text="${#numbers.formatDecimal(a.prixTotal, 1, 2) + ' MGA'}">0.00 MGA</td>
                        <td class="px-6 py-4 text-center">
                            <a th:href="@{/achats/details/{id}(id=${a.id})}" 
                               class="text-indigo-600 hover:text-indigo-900 font-medium text-sm">
                                Consulter
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
