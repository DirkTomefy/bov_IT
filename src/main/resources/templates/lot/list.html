<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des lots</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e9edf2 100%);
            min-height: 100vh;
        }
        .card-custom {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .card-custom:hover {
            transform: translateY(-5px);
        }
        .table-custom {
            border-radius: 15px;
            overflow: hidden;
        }
        .table-custom th {
            background-color: #2c3e50;
            color: white;
            font-weight: 600;
            border: none;
        }
        .btn-icon {
            margin: 0 5px;
            transition: all 0.2s;
        }
        .btn-icon:hover {
            transform: scale(1.05);
        }
        .header-title {
            border-left: 5px solid #3498db;
            padding-left: 15px;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="card card-custom">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">
                <div>
                    <h1 class="header-title"><i class="bi bi-box-seam me-2 text-primary"></i>Gestion des lots</h1>
                    <p class="text-muted mt-2">Liste complète des lots enregistrés par race</p>
                </div>
                <a th:href="@{/lot/creer}" class="btn btn-primary rounded-pill shadow-sm">
                    <i class="bi bi-plus-circle me-1"></i> Ajouter un lot
                </a>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle table-custom">
                    <thead>
                    <tr>
                        <th width="80">ID</th>
                        <th>Race</th>
                        <th>Nombre</th>
                        <th>Date de création</th>
                        <th width="150" class="text-center">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="lot : ${lots}">
                        <td><span class="badge bg-secondary rounded-pill" th:text="${lot.id}">1</span></td>
                        <td>
                            <i class="bi bi-tag-fill text-primary me-2"></i>
                            <span th:text="${lot.race.libelle}" class="fw-semibold"></span>
                        </td>
                        <td>
                            <i class="bi bi-hash text-muted me-1"></i>
                            <span th:text="${lot.nombre}">0</span>
                        </td>
                        <td>
                            <i class="bi bi-calendar3 text-muted me-2"></i>
                            <span th:text="${#temporals.format(lot.dateCreation, 'dd-MM-yyyy HH:mm')}">01-01-2026 00:00</span>
                        </td>
                        <td class="text-center action-icons">
                            <a th:href="@{/lot/modif/{id}(id=${lot.id})}" class="btn btn-sm btn-outline-warning btn-icon" title="Modifier">
                                <i class="bi bi-pencil-square"></i>
                            </a>
                            <a th:href="@{/lot/delete/{id}(id=${lot.id})}" class="btn btn-sm btn-outline-danger btn-icon" title="Supprimer"
                               onclick="return confirm('Supprimer définitivement ce lot ?')">
                                <i class="bi bi-trash3"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(lots)}">
                        <td colspan="5" class="text-center py-4">
                            <i class="bi bi-inbox display-4 text-muted"></i>
                            <p class="mt-2 mb-0">Aucun lot enregistré pour le moment.</p>
                            <a th:href="@{/lot/creer}" class="btn btn-sm btn-primary mt-2">Créer le premier lot</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
